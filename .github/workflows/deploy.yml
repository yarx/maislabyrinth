name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # SPA-Fallback: GitHub Pages liefert 404.html für unbekannte Pfade (z.B. /verlosung)
      - run: cp dist/maislabyrinth-freiamt/browser/index.html dist/maislabyrinth-freiamt/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/maislabyrinth-freiamt/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
