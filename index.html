<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maislabyrinth Freiamt</title>
    <style>
        :root {
            --navy: #1a3a6b;
            --bg: #f7f5ef;
            --text: var(--navy);
            --shadow: rgba(26, 58, 107, 0.25);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14171c;
                --text: #f7f5ef;
                --shadow: rgba(0, 0, 0, 0.55);
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }
        .logo {
            display: block;
            width: 100%;
            max-width: 420px;
            height: auto;
            margin: 0 auto 2rem;
            border-radius: 12px;
            box-shadow: 0 12px 32px var(--shadow);
        }
        p {
            font-size: 1.15rem;
            line-height: 1.5;
            margin: 0;
            font-weight: 500;
        }
        @media (min-width: 768px) {
            .container { max-width: 640px; }
            .logo { max-width: 480px; }
            p { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <img src="logo-mais-labyrinth-freiamt.jpg" alt="Maislabyrinth Freiamt – Villmergen, Sommer 2026" class="logo">
        <p>Hier entsteht die Webseite für das Maislabyrinth in Villmergen. Infos folgen bald.</p>
    </main>
</body>
</html>
